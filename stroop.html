<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ストループ課題</title>
    <script src="https://unpkg.com/jspsych@7.3.1"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.2"></script>
    <link rel="stylesheet" href="https://unpkg.com/jspsych@7.3.1/css/jspsych.css">
    
    <style>
        html, body {
            background-color: #FFFFFF;
            color: #333;
            font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden; /* スクロールバー（ストロークバー）を完全に非表示にする */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ブラウザ独自のスクロールバーを非表示にする（念のため） */
        ::-webkit-scrollbar { display: none; }
        * { -ms-overflow-style: none; scrollbar-width: none; }

        /* jsPsychのコンテナを画面全体に広げ、中央揃えを強制 */
        .jspsych-content-wrapper {
            display: flex !important;
            justify-content: center !important;
            align-items: center !important;
            width: 100% !important;
            height: 100% !important;
        }

        .jspsych-content {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 刺激（文字）のスタイル */
        .stimulus {
            font-size: 60px;
            font-weight: bold;
            line-height: 1;
            user-select: none;
            text-align: center;
        }

        /* 教示のスタイル */
        .instructions {
            font-size: 24px;
            line-height: 1.6;
            text-align: center;
            max-width: 800px;
        }

        /* 注視点のスタイル */
        .fixation {
            font-size: 60px;
            line-height: 1;
        }
    </style>
</head>
<body>
    <div id="jspsych-target"></div>

    <script>
        const jsPsych = initJsPsych({
            display_element: 'jspsych-target',
            on_finish: function() {
                // 実験終了後にCSVデータを表示
                jsPsych.data.displayData('csv');
            }
        });

        const words = ["赤", "青", "緑"];
        const colors = ["red", "blue", "green"];
        const keyMap = { "red": "r", "blue": "b", "green": "g" };

        let all_stimuli = [];
        for (let w of words) {
            for (let c of colors) {
                const isCongruent = (
                    (w === "赤" && c === "red") || 
                    (w === "青" && c === "blue") || 
                    (w === "緑" && c === "green")
                );
                all_stimuli.push({
                    stimulus_text: w,
                    stimulus_color: c,
                    correct_response: keyMap[c],
                    condition: isCongruent ? "congruent" : "incongruent"
                });
            }
        }

        const timeline = [];

        const instructions = {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: `
                <div class="instructions">
                    <p>画面に表示される文字の<strong>「色」</strong>を答えてください。</p>
                    <div style="margin: 30px 0; font-size: 20px; border: 1px solid #ccc; padding: 20px; border-radius: 10px;">
                        赤色の文字なら ... <strong>'r'</strong> キー<br>
                        青色の文字なら ... <strong>'b'</strong> キー<br>
                        緑色の文字なら ... <strong>'g'</strong> キー
                    </div>
                    <p>※正しい色のキーを押すまで次へ進みません。</p>
                    <p>準備ができたら<strong>スペースキー</strong>で開始します。</p>
                </div>
            `,
            choices: [' '], // スペースキー以外は受け付けない
            post_trial_gap: 500
        };
        timeline.push(instructions);

        // 注視点
        const fixation = {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: '<div class="fixation">+</div>',
            choices: "NO_KEYS",
            trial_duration: 500,
            data: { task: 'fixation' }
        };

        // メイン試行
        const trial = {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: function() {
                const text = jsPsych.timelineVariable('stimulus_text');
                const color = jsPsych.timelineVariable('stimulus_color');
                return `<div class="stimulus" style="color: ${color};">${text}</div>`;
            },
            // 正解のキー以外は反応しないように制限
            choices: function() {
                return [jsPsych.timelineVariable('correct_response')];
            },
            data: {
                task: 'response',
                condition: jsPsych.timelineVariable('condition'),
                correct_response: jsPsych.timelineVariable('correct_response'),
                word: jsPsych.timelineVariable('stimulus_text'),
                color: jsPsych.timelineVariable('stimulus_color')
            }
        };

        // 試行間隔 (ITI)
        const iti = {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: '',
            choices: "NO_KEYS",
            trial_duration: 1000
        };

        const test_procedure = {
            timeline: [fixation, trial, iti],
            timeline_variables: all_stimuli,
            randomize_order: true,
            sample: {
                type: 'with-replacement',
                size: 10 // 合計10試行をランダムに実施
            }
        };
        timeline.push(test_procedure);

        jsPsych.run(timeline);
    </script>
</body>
</html>
