<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ストループ課題 実験 (Stroop Task)</title>
    
    <!-- jsPsych 7.3.4 本体CSS -->
    <link href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css" rel="stylesheet" type="text/css" />
    
    <!-- jsPsych 7.3.4 本体スクリプト -->
    <script src="https://unpkg.com/jspsych@7.3.4"></script>
    
    <!-- jsPsych キーボード反応プラグイン (v7互換) -->
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.3"></script>

    <!-- jsPsych 調査プラグイン (survey-text) -->
    <script src="https://unpkg.com/@jspsych/plugin-survey-text@1.1.3"></script>
    
    <!-- スタイリングのための Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        /* jsPsychのコンテナ要素を画面いっぱいに広げ、上下左右中央に確実に配置 */
        body {
            background-color: #F8FAFC; /* 目に優しいライトグレー */
            font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden; /* スクロールバーを非表示にして実験に集中 */
        }
        .jspsych-content-wrapper {
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            min-height: 100vh !important;
            width: 100vw !important;
        }
        .jspsych-content {
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
            justify-content: center !important;
            text-align: center !important;
        }
        /* 刺激表示用の文字スタイル定義 */
        .stroop-stimulus {
            font-size: 72px;
            font-weight: 800;
            user-select: none; /* テキスト選択を防止 */
            letter-spacing: 4px;
        }
        /* 教示画面用の文字スタイル定義 */
        .instruction-text {
            font-size: 18px;
            line-height: 1.8;
            max-width: 800px;
            text-align: left;
        }

        /* jsPsych標準の入力フォーム部品をモダンにカスタマイズ */
        .jspsych-survey-text-question {
            margin: 1.5em 0 !important;
            text-align: left !important;
        }
        .jspsych-survey-text-question input[type="text"] {
            width: 100% !important;
            max-width: 350px !important;
            padding: 12px 16px !important;
            font-size: 18px !important;
            border: 2px solid #E2E8F0 !important;
            border-radius: 12px !important;
            transition: all 0.2s ease !important;
            background-color: #FFFFFF !important;
            color: #1E293B !important;
        }
        .jspsych-survey-text-question input[type="text"]:focus {
            border-color: #4F46E5 !important;
            outline: none !important;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.15) !important;
        }
        /* ボタン類のプレミアムモダン化 */
        .jspsych-btn {
            background-color: #4F46E5 !important;
            background-image: none !important;
            color: white !important;
            padding: 12px 36px !important;
            font-size: 16px !important;
            font-weight: 600 !important;
            border-radius: 12px !important;
            border: none !important;
            transition: all 0.2s ease !important;
            box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.2), 0 2px 4px -1px rgba(79, 70, 229, 0.1) !important;
        }
        .jspsych-btn:hover {
            background-color: #4338CA !important;
            transform: translateY(-1px) !important;
            box-shadow: 0 6px 8px -1px rgba(79, 70, 229, 0.25), 0 4px 6px -1px rgba(79, 70, 229, 0.15) !important;
        }
        .jspsych-btn:active {
            transform: translateY(1px) !important;
        }
    </style>
</head>
<body>

    <script>
        // ==========================================
        // [重要] 送信先GASのウェブアプリURL
        // ※ 自身で新しくデプロイした「ウェブアプリURL」に書き換えてください。
        // ==========================================
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzTXtjyF3RnGSDTDN8jMHjwDCA6Dm_On-GSFM1fvXBzUTJnZAIJv9TEPP4oXpJUH5GmFA/exec";

        // 日本語環境に適した見やすいタイムスタンプを生成するユーティリティ関数
        function getFormattedTimestamp() {
            const now = new Date();
            const y = now.getFullYear();
            const m = String(now.getMonth() + 1).padStart(2, '0');
            const d = String(now.getDate()).padStart(2, '0');
            const h = String(now.getHours()).padStart(2, '0');
            const min = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            return `${y}-${m}-${d} ${h}:${min}:${s}`;
        }

        // jsPsychの初期化（実験終了時にデータをフィルタして自動送信）
        const jsPsych = initJsPsych({
            on_finish: function() {
                // 実験終了時にデータを抽出・整形してGASに自動アップロード
                uploadExperimentData();
            }
        });

        // 刺激（文字と色）の組み合わせ定義
        // 3文字（赤・青・緑）× 3色（赤・青・緑）= 9パターン
        const stimuli_pool = [
            // 一致条件 (Congruent)
            { word: "赤", color: "red", label: "R", congruency: "congruent" },
            { word: "青", color: "blue", label: "B", congruency: "congruent" },
            { word: "緑", color: "green", label: "G", congruency: "congruent" },
            // 不一致条件 (Incongruent)
            { word: "赤", color: "blue", label: "B", congruency: "incongruent" },
            { word: "赤", color: "green", label: "G", congruency: "incongruent" },
            { word: "青", color: "red", label: "R", congruency: "incongruent" },
            { word: "青", color: "green", label: "G", congruency: "incongruent" },
            { word: "緑", color: "red", label: "R", congruency: "incongruent" },
            { word: "緑", color: "blue", label: "B", congruency: "incongruent" }
        ];

        // 10個サンプリング
        const selected_trials = jsPsych.randomization.sampleWithReplacement(stimuli_pool, 10);

        // タイムラインオブジェクトの生成
        const timeline = [];

        // 1. 参加者情報入力画面の追加 (survey-textプラグイン)
        const survey_trial = {
            type: jsPsychSurveyText,
            questions: [
                { 
                    prompt: `
                        <div class="text-center">
                            <h2 class="text-3xl font-extrabold text-gray-800 mb-2">参加者IDの入力</h2>
                            <p class="text-sm text-gray-500 mb-6">実験データを正確に管理するため、あなたのID（例：学籍番号）を入力してください。</p>
                        </div>
                    `, 
                    placeholder: "学籍番号または任意のID",
                    name: "subject_id", 
                    required: true 
                }
            ],
            button_label: "次へ進む",
            on_finish: function(data) {
                // 入力された参加者IDを抽出
                const entered_id = data.response.subject_id;
                
                // これ以降のすべての試行データに自動で「ID」と「同一の実施日時」を付加する
                jsPsych.data.addProperties({
                    subject_id: entered_id,
                    timestamp: getFormattedTimestamp()
                });
            }
        };
        timeline.push(survey_trial);

        // 2. 実験説明画面 (インストラクション)
        const instruction_trial = {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: `
                <div class="instruction-text bg-white p-8 md:p-12 rounded-3xl shadow-xl border border-gray-100 max-w-3xl mx-auto">
                    <p class="text-center font-extrabold text-3xl mb-8 text-indigo-900">【ストループ課題】</p>
                    <p class="text-gray-700 text-lg mb-2">画面中央に「赤」「青」「緑」のいずれかの文字が表示されます。</p>
                    <p class="mb-4 text-gray-700 text-lg">文字の意味にとらわれず、<strong class="text-red-500 font-bold">文字の「色」</strong>をできるだけ速く、正確にキーボードで答えてください。</p>
                    
                    <div class="border-t border-b border-gray-100 py-6 my-6 bg-slate-50 rounded-2xl text-center">
                        <p class="font-bold mb-4 text-xl text-slate-800">対応するキー：</p>
                        <div class="flex flex-col md:flex-row justify-around items-center gap-4 px-2">
                            <div class="flex items-center gap-2">
                                <span class="text-gray-600 font-medium">赤色の文字なら</span>
                                <span class="inline-flex bg-red-100 text-red-700 px-4 py-1.5 rounded-xl font-bold border border-red-300 text-2xl">R</span>
                            </div>
                            <div class="flex items-center gap-2">
                                <span class="text-gray-600 font-medium">青色の文字なら</span>
                                <span class="inline-flex bg-blue-100 text-blue-700 px-4 py-1.5 rounded-xl font-bold border border-blue-300 text-2xl">B</span>
                            </div>
                            <div class="flex items-center gap-2">
                                <span class="text-gray-600 font-medium">緑色の文字なら</span>
                                <span class="inline-flex bg-emerald-100 text-emerald-700 px-4 py-1.5 rounded-xl font-bold border border-emerald-300 text-2xl">G</span>
                            </div>
                        </div>
                    </div>
                    
                    <p class="mt-8 text-center text-indigo-600 text-xl font-semibold animate-pulse">
                        ※キーボードの「スペースキー」を押すと、すぐに本番（10試行）が始まります。
                    </p>
                </div>
            `,
            choices: [' '] // スペースキーの入力を受け付ける
        };
        timeline.push(instruction_trial);

        // 各試行は、注視点(+) 500ms -> ストループ刺激(キー反応まで)
        // ※「空白のページ（ITI）」を排除し、反応後すぐに次の画面へ進むように最適化
        selected_trials.forEach((trial_info, index) => {
            
            // a. 注視点 (+) 提示 (500ms, 反応は受け付けず消去)
            const fixation = {
                type: jsPsychHtmlKeyboardResponse,
                stimulus: '<div class="text-7xl font-light text-slate-400 select-none">+</div>',
                choices: "NO_KEYS",
                trial_duration: 500
            };

            // b. 刺激提示試行 (キー入力があるまで無限に提示)
            let text_color_hex = "#000000";
            if (trial_info.color === "red") text_color_hex = "#EF4444"; // 赤
            if (trial_info.color === "blue") text_color_hex = "#3B82F6"; // 青
            if (trial_info.color === "green") text_color_hex = "#10B981"; // 緑

            const stroop_stimulus_trial = {
                type: jsPsychHtmlKeyboardResponse,
                stimulus: `<div class="stroop-stimulus" style="color: ${text_color_hex};">${trial_info.word}</div>`,
                choices: ['r', 'b', 'g'], // 反応キーは「r」「b」「g」のみ受付
                data: {
                    phase: 'test',
                    trial_index: index + 1,
                    word: trial_info.word,
                    color: trial_info.color,
                    condition: trial_info.congruency,
                    correct_response: trial_info.label.toLowerCase() // r, b, g
                },
                on_finish: function(data) {
                    const is_correct = (data.response === data.correct_response);
                    // 要求仕様通り、必ず true / false の文字列で正確に記録
                    data.correct = is_correct ? "true" : "false";
                    
                    // 反応時間をミリ秒単位（ミリセカンド）の整数値に変更
                    if (data.rt !== null && data.rt !== undefined) {
                        data.rt = Math.round(data.rt);
                    }
                }
            };

            // 注視点と刺激提示のみをタイムラインに追加（不要な空白ITIは削除）
            timeline.push(fixation);
            timeline.push(stroop_stimulus_trial);
        });

        /**
         * 分析に必要な不要な行を排したCSVデータを組み立てる関数
         */
        function generateFilteredCSV() {
            const testTrials = jsPsych.data.get().filter({ phase: 'test' }).values();
            const headers = ['subject_id', 'timestamp', 'word', 'color', 'condition', 'rt', 'correct'];
            
            const csvRows = [];
            csvRows.push(headers.join(',')); // ヘッダー
            
            testTrials.forEach(trial => {
                const rowValues = headers.map(header => {
                    let value = trial[header];
                    if (value === undefined || value === null) {
                        value = '';
                    }
                    
                    let valStr = String(value);
                    if (valStr.includes(',') || valStr.includes('"') || valStr.includes('\n')) {
                        valStr = '"' + valStr.replace(/"/g, '""') + '"';
                    }
                    return valStr;
                });
                csvRows.push(rowValues.join(','));
            });
            
            return csvRows.join('\n');
        }

        /**
         * jsPsychの終了時に呼び出され、GASへ自動アップロードする処理
         */
        function uploadExperimentData() {
            const csvData = generateFilteredCSV();
            console.log("== [送信対象のCSVデータ] ==");
            console.log(csvData);
            
            const maxRetries = 5;
            const initialDelay = 1000;

            function updateStatus(message) {
                const displayElement = jsPsych.getDisplayElement();
                displayElement.innerHTML = `
                    <div class="flex flex-col items-center justify-center p-8 bg-white max-w-xl mx-auto rounded-3xl shadow-xl border border-gray-100 text-center">
                        <div class="animate-spin rounded-full h-16 w-16 border-b-4 border-indigo-600 mb-6"></div>
                        <h3 class="text-2xl font-bold text-gray-800 mb-2">データを保存中...</h3>
                        <p class="text-lg text-indigo-600 font-semibold">${message}</p>
                        <p class="text-sm text-gray-400 mt-4">ブラウザを閉じたり戻ったりせず、このままお待ちください。</p>
                    </div>
                `;
            }

            function showSuccess() {
                const displayElement = jsPsych.getDisplayElement();
                displayElement.innerHTML = `
                    <div class="flex flex-col items-center justify-center p-12 bg-white max-w-xl mx-auto rounded-3xl shadow-2xl border border-emerald-100 text-center">
                        <div class="bg-emerald-100 p-5 rounded-full text-emerald-600 mb-6">
                            <svg class="h-16 w-16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path>
                            </svg>
                        </div>
                        <h2 class="text-3xl font-extrabold text-gray-800 mb-4">保存完了しました</h2>
                        <p class="text-lg text-gray-600 mb-8 leading-relaxed">実験データはスプレッドシートへ安全に保存されました。<br>ご協力いただき、心より感謝申し上げます。</p>
                        <p class="text-sm text-gray-400">このタブ・ウィンドウは安全に閉じていただいて構いません。</p>
                    </div>
                `;
            }

            function showFailure(errorMessage) {
                const displayElement = jsPsych.getDisplayElement();
                displayElement.innerHTML = `
                    <div class="flex flex-col items-center justify-center p-8 bg-white max-w-2xl mx-auto rounded-3xl shadow-2xl border border-red-100 text-center">
                        <div class="bg-red-100 p-5 rounded-full text-red-600 mb-6">
                            <svg class="h-14 w-14" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
                            </svg>
                        </div>
                        <h2 class="text-2xl font-black text-red-700 mb-2">データの自動保存に失敗しました</h2>
                        <p class="text-md text-gray-600 mb-6 leading-relaxed">セキュリティ制限またはURL設定間違いにより保存がブロックされました。<br>大変お手数ですが、<span class="font-bold text-indigo-600">以下の枠内のテキストをすべてコピーして実験者にお渡しください。</span></p>
                        
                        <div class="w-full text-left bg-slate-50 border border-slate-200 rounded-2xl p-5 mb-6">
                            <label class="block text-sm font-bold text-slate-700 mb-2">【手動回収用CSVデータ】 (クリックで全選択＆自動コピー)</label>
                            <textarea id="manual-csv-area" class="w-full h-44 p-3 font-mono text-xs text-slate-800 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none" readonly onclick="this.select(); document.execCommand('copy'); alert('CSVデータをクリップボードにコピーしました。');">${csvData}</textarea>
                            <p class="text-xs text-slate-400 mt-2">※枠内をタップ/クリックすると全選択＆コピーができます。</p>
                        </div>
                        
                        <div class="flex gap-4">
                            <button onclick="location.reload()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold py-3 px-6 rounded-xl transition duration-150">
                                はじめから再実験する
                            </button>
                            <button onclick="uploadExperimentData()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-6 rounded-xl transition duration-150">
                                再接続・再送信を試みる
                            </button>
                        </div>
                    </div>
                `;
            }

            function attemptFetch(attemptNumber) {
                console.log(`[送信試行] ${attemptNumber}/${maxRetries} 回目 を開始...`);
                updateStatus(`サーバーへ通信中... (${attemptNumber}/${maxRetries}回目)`);

                // ★ CORSプリフライト(OPTIONS)を完全に回避するため、Content-Typeを 'text/plain' にし、
                // 送信データをJSON形式（{ csvData: "..." }）にパッケージングして送信します。
                const payload = {
                    csvData: csvData
                };

                fetch(GAS_WEB_APP_URL, {
                    method: 'POST',
                    mode: 'cors',
                    redirect: 'follow',
                    headers: {
                        'Content-Type': 'text/plain' // シンプルリクエスト扱いにすることで、CORS拒否を突破！
                    },
                    body: JSON.stringify(payload)
                })
                .then(response => {
                    console.log(`[HTTPレスポンス受信] ステータス: ${response.status}`);
                    if (!response.ok) {
                        throw new Error(`HTTPステータスエラー: ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    console.log("[GASから返却されたデータ]", data);
                    if (data && data.status === 'success') {
                        console.log("スプレッドシートへの保存に大成功しました！");
                        showSuccess();
                    } else {
                        throw new Error(data.message || 'GAS内部の書き込み処理で何らかのエラーが発生しました。');
                    }
                })
                .catch(error => {
                    console.error(`[エラー発生 - 試行 ${attemptNumber}]:`, error);
                    
                    if (attemptNumber < maxRetries) {
                        const delay = initialDelay * Math.pow(2, attemptNumber - 1) + Math.random() * 500;
                        console.log(`${Math.round(delay)}ms 後に再試行します。`);
                        updateStatus(`接続失敗。再試行中... (待機時間: ${Math.round(delay)}ms)`);
                        setTimeout(() => {
                            attemptFetch(attemptNumber + 1);
                        }, delay);
                    } else {
                        console.error("すべてのリトライが失敗しました。自動コピー用画面を表示します。");
                        showFailure(error.message);
                    }
                });
            }

            attemptFetch(1);
        }

        // 設定されたすべてのプロセスを起動
        jsPsych.run(timeline);
    </script>
</body>
</html>
