<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ストループ課題 実験 (Stroop Task)</title>
    
    <!-- jsPsych 7.3.4 本体CSS -->
    <link href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css" rel="stylesheet" type="text/css" />
    
    <!-- jsPsych 7.3.4 本体スクリプト -->
    <script src="https://unpkg.com/jspsych@7.3.4"></script>
    
    <!-- jsPsych キーボード反応プラグイン (v7互換) -->
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.3"></script>
    
    <!-- スタイリングのための Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        /* jsPsychのコンテナ要素を画面いっぱいに広げ、上下左右中央に確実に配置します */
        body {
            background-color: #FFFFFF;
            font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden; /* スクロールバーを非表示にして実験に集中させます */
        }
        .jspsych-content-wrapper {
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            min-height: 100vh !important;
            width: 100vw !important;
        }
        .jspsych-content {
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
            justify-content: center !important;
            text-align: center !important;
        }
        /* 刺激表示用の文字スタイル定義 */
        .stroop-stimulus {
            font-size: 60px;
            font-weight: bold;
            user-select: none; /* テキスト選択を防止 */
        }
        /* 教示画面用の文字スタイル定義 */
        .instruction-text {
            font-size: 24px;
            line-height: 1.8;
            max-width: 800px;
            text-align: left;
        }
    </style>
</head>
<body>

    <script>
        
        // jsPsychの初期化（実験終了時にデータを画面へCSVとして表示）
        const jsPsych = initJsPsych({
            on_finish: function() {
                // 実験データをクリアなCSV形式として画面に表示します
                jsPsych.data.displayData('csv');
            }
        });

        // 刺激（文字と色）の組み合わせ定義
        // 3文字（赤・青・緑）× 3色（赤・青・緑）= 9パターンのプールを作成します
        const stimuli_pool = [
            // 一致条件 (Congruent)
            { word: "赤", color: "red", label: "R", congruency: "congruent" },
            { word: "青", color: "blue", label: "B", congruency: "congruent" },
            { word: "緑", color: "green", label: "G", congruency: "congruent" },
            // 不一致条件 (Incongruent)
            { word: "赤", color: "blue", label: "B", congruency: "incongruent" },
            { word: "赤", color: "green", label: "G", congruency: "incongruent" },
            { word: "青", color: "red", label: "R", congruency: "incongruent" },
            { word: "青", color: "green", label: "G", congruency: "incongruent" },
            { word: "緑", color: "red", label: "R", congruency: "incongruent" },
            { word: "緑", color: "blue", label: "B", congruency: "incongruent" }
        ];

        // 9パターンの刺激プールから重複を許してランダムに10個サンプリングする
        const selected_trials = jsPsych.randomization.sampleWithReplacement(stimuli_pool, 10);

        // タイムラインオブジェクトの生成
        const timeline = [];

        // 実験が始まると、最初の全画面化確認ボタンは介さず、ここから直接スタートします
        const instruction_trial = {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: `
                <div class="instruction-text">
                    <p class="text-center font-bold text-3xl mb-8">【ストループ課題】</p>
                    <p>画面中央に「赤」「青」「緑」のいずれかの文字が表示されます。</p>
                    <p class="mb-4">文字の意味にとらわれず、<strong class="text-red-600">文字の「色」</strong>をできるだけ速く、正確にキーボードで答えてください。</p>
                    
                    <div class="border-t border-b border-gray-300 py-6 my-6 bg-gray-50 rounded-xl text-center">
                        <p class="font-bold mb-4 text-2xl">対応するキー：</p>
                        <div class="flex justify-around items-center px-4">
                            <div>赤色の文字なら <span class="inline-block bg-red-100 text-red-700 px-4 py-1 rounded font-bold border border-red-300 text-3xl ml-1">R</span> キー</div>
                            <div>青色の文字なら <span class="inline-block bg-blue-100 text-blue-700 px-4 py-1 rounded font-bold border border-blue-300 text-3xl ml-1">B</span> キー</div>
                            <div>緑色の文字なら <span class="inline-block bg-green-100 text-green-700 px-4 py-1 rounded font-bold border border-green-300 text-3xl ml-1">G</span> キー</div>
                        </div>
                    </div>
                    
                    <p class="mt-8 text-center text-gray-500 text-xl font-medium animate-pulse">
                        ※キーボードの「スペースキー」を押すと、すぐに実験（10試行）が始まります。
                    </p>
                </div>
            `,
            choices: [' '] // スペースキーの入力を受け付ける
        };
        timeline.push(instruction_trial);

        // 各試行は、注視点(+) 500ms -> ストループ刺激(キー反応まで) -> ITI(空白) 1000ms で進行します。
        selected_trials.forEach((trial_info, index) => {
            
            // a. 注視点 (+) 提示 (500ms, 反応は受け付けず消去)
            const fixation = {
                type: jsPsychHtmlKeyboardResponse,
                stimulus: '<div class="text-6xl font-light text-gray-400 select-none">+</div>',
                choices: "NO_KEYS",
                trial_duration: 500
            };

            // b. 刺激提示試行 (キー入力があるまで無限に提示)
            // 文字の色に合うTailwindのカラーコードを指定します
            let text_color_hex = "#000000";
            if (trial_info.color === "red") text_color_hex = "#EF4444"; // 赤
            if (trial_info.color === "blue") text_color_hex = "#3B82F6"; // 青
            if (trial_info.color === "green") text_color_hex = "#10B981"; // 緑

            const stroop_stimulus_trial = {
                type: jsPsychHtmlKeyboardResponse,
                stimulus: `<div class="stroop-stimulus" style="color: ${text_color_hex};">${trial_info.word}</div>`,
                choices: ['r', 'b', 'g'], // 反応キーは「r」「b」「g」のみ受付
                data: {
                    phase: 'test',
                    trial_index: index + 1,
                    word: trial_info.word,
                    color: trial_info.color,
                    congruency: trial_info.congruency,
                    correct_response: trial_info.label.toLowerCase() // r, b, g に揃える
                },
                on_finish: function(data) {
                    // 参加者の回答が正解（correct）かどうかを判定・記録
                    const is_correct = (data.response === data.correct_response);
                    data.correct = is_correct ? 1 : 0;
                }
            };

            // c. 試行間隔 (ITI): 1000ms (画面は空白)
            const iti = {
                type: jsPsychHtmlKeyboardResponse,
                stimulus: '', // 何も表示しない
                choices: "NO_KEYS",
                trial_duration: 1000
            };

            // 各試行を順番に全体のメインタイムラインに追加
            timeline.push(fixation);
            timeline.push(stroop_stimulus_trial);
            timeline.push(iti);
        });

        // 設定されたすべてのプロセスを起動
        jsPsych.run(timeline);
    </script>
</body>
</html>
