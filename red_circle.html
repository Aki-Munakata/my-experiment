<!DOCTYPE html>
<html>
<head>
  <title>jsPsych 赤い円の提示実験</title>
  <!-- jsPsych v7 をCDNから読み込み -->
  <script src="https://unpkg.com/jspsych@7.3.4"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.3"></script>
  <link href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css" rel="stylesheet" type="text/css" />
  <style>
    /* 1. 背景色を灰色に設定 */
    body {
      background-color: #808080;
      color: white;
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* 2. CSSで赤い円を定義 */
    .red-circle {
      width: 100px;
      height: 100px;
      background-color: #ff0000; /* 赤色 */
      border-radius: 50%; /* 正円にする設定 */
      margin: 0 auto;
    }

    .message {
      font-family: "Hiragino Kaku Gothic ProN", "ヒラギノ角ゴ ProN W3", "Meiryo", "メイリオ", sans-serif;
      margin-top: 20px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="jspsych-target"></div>
</body>
<script>
  /**
   * jsPsych 赤い円提示タスク
   * 仕様:
   * - 背景: #808080
   * - 刺激: 100pxの赤い円 (CSS)
   * - 反応キー: スペースキー
   */

  // jsPsychの初期化
  const jsPsych = initJsPsych({
    on_finish: function() {
      // 必要に応じて終了後のデータ処理をここに記述
    }
  });

  // 円を提示するトライアルの定義
  const circle_trial = {
    type: jsPsychHtmlKeyboardResponse,
    stimulus: `
      <div class="red-circle"></div>
      <div class="message">スペースキーを押すと次に進みます</div>
    `,
    choices: [' '], // スペースキーのみを受け付ける
    data: {
      task: 'display_red_circle'
    }
  };

  // 終了メッセージの定義
  const end_message = {
    type: jsPsychHtmlKeyboardResponse,
    stimulus: `
      <div class="message">
        <h1>終了</h1>
        <p>実験が終わりました。ご協力ありがとうございました。</p>
      </div>
    `,
    choices: "NO_KEYS", // キー入力を受け付けない
    duration: 3000 // 3秒間表示して終了
  };

  // タイムラインの作成
  const timeline = [circle_trial, end_message];

  // 実験の実行
  jsPsych.run(timeline);
</script>
</html>
