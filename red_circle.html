<html>
<head>
  <title>jsPsych Red Circle Experiment</title>
  <!-- Load jsPsych v7 from CDN -->
  <script src="https://unpkg.com/jspsych@7.3.4"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.3"></script>
  <link href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css" rel="stylesheet" type="text/css" />
  <style>
    /* 1. Set background color to gray */
    body {
      background-color: #808080;
      color: white;
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* 2. Define the red circle using CSS */
    .red-circle {
      width: 100px;
      height: 100px;
      background-color: #ff0000; /* Red color */
      border-radius: 50%; /* Makes it a circle */
      margin: 0 auto;
    }

    .message {
      font-family: sans-serif;
      margin-top: 20px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="jspsych-target"></div>
</body>
<script>
  /**
   * jsPsych Red Circle Task
   * Specifications:
   * - Background: #808080
   * - Stimulus: 100px red circle (CSS)
   * - Trigger: Space key
   */

  // Initialize jsPsych
  const jsPsych = initJsPsych({
    on_finish: function() {
      // Logic for after the experiment finishes
    }
  });

  // Define the circle display trial
  const circle_trial = {
    type: jsPsychHtmlKeyboardResponse,
    stimulus: `
      <div class="red-circle"></div>
      <div class="message">Press SPACE to continue</div>
    `,
    choices: [' '], // Listen for space key
    data: {
      task: 'display_red_circle'
    }
  };

  // Define the end message trial
  const end_message = {
    type: jsPsychHtmlKeyboardResponse,
    stimulus: `
      <div class="message">
        <h1>Finished</h1>
        <p>The experiment has ended. Thank you.</p>
      </div>
    `,
    choices: "NO_KEYS", // Prevent further interaction
    duration: 3000 // Display for 3 seconds before finishing
  };

  // Create timeline
  const timeline = [circle_trial, end_message];

  // Run the experiment
  jsPsych.run(timeline);
</script>
</html>
